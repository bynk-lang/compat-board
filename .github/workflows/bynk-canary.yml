# Bynk canary: re-run this repository's checks against a new Bynk release, and
# keep a `canary` issue open while they fail.
#
# Triggered by the org dispatcher in bynk-lang/.github (on each Bynk release,
# and weekly), which is why there is no `schedule` here. This repository is
# listed in bynk-lang/.github's canary/repos.json (kind `example`), and the
# canary GitHub App is installed on it.
# See https://github.com/bynk-lang/.github/blob/main/canary/README.md
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.309.4") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Canary
    uses: bynk-lang/.github/.github/workflows/canary.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      kind: example
      source: .
      deploy-dry-run: true
    secrets:
      # The board reports its own canary results to itself, once deployed.
      report-url: ${{ secrets.BYNK_CANARY_REPORT_URL }}
      report-key: ${{ secrets.BYNK_CANARY_REPORT_KEY }}
